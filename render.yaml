services:
  - type: web
    name: n8n-free
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free  # ← Free tier
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Database (Supabase Free)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: true
      
      # n8n Minimal Config
      - key: N8N_HOST
        sync: false
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      
      # Memory Optimization (Critical for Free Tier!)
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: EXECUTIONS_PROCESS
        value: main
      - key: N8N_RUNNERS_DISABLED
        value: true
      
      # Execution Settings
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: none
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none
      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: false
      
      # Disable Heavy Features
      - key: N8N_DIAGNOSTICS_ENABLED
        value: false
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: false
      - key: N8N_TEMPLATES_ENABLED
        value: false
